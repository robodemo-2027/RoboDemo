name: Offline release tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  interfaces:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [human, robot]
    env:
      CUDA_VISIBLE_DEVICES: ""
      ROBODEMO_TEST_VARIANT: ${{ matrix.variant }}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r environments/requirements-tests.txt
      - name: Core model, orchestration and recorded sample tests
        run: python -m pytest -q tests
      - name: Inspect recorded policy inputs
        run: python examples/predict_actions.py --inspect-only
