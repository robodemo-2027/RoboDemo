  demottt:
    reference_cache_size: 16
    reference_cache_device: cpu
    cache_reference_semantics: true
    trainable_parameters_fp32: true
    retrieval_memory_mode: full_reference
    hidden_size: 1024
    vision_dim: 2560
    num_heads: 8
    expansion: 4
    retrieval_registers: 32
    execution_registers: 16
    resampler_heads: 8
    maximum_views: 8
    retrieval_writer_views:
    - ego
    execution_writer_views:
    - ego
    inner_lr: 0.1
    layer_norm_eps: 1.0e-08
    readout_mode: dynamic_delta
    update_clip_ratio: 0.05
    reference_scale_floor: 0.001
    detach_clip_scale: true
    scan_backend: compiled_fused
    checkpoint_chunk_size: 8
    gate_init: 0.1
    weight_decay: 0.0001
    training_repeat: 1
    trajectory_stride: 1
    freeze_vlm: true
    retrieval_phases: 4
    phase_routing_loss_weight: 0.0
    consistency_loss_weight: 0.0
    phase_teacher_start_probability: 0.0
    phase_teacher_end_probability: 0.0
    metadata_dropout: 0.1
    retrieval_phase_sampling:
      profile_selected: ig_uniform_quarters_12_16
      temporal_frame_selection: normalized_time_within_each_quarter
      sampler_manifest_hash: 5e041cf85e1fbf1fc6eadf749ceaa84dcc9cc49f3468c29d57c0542d34e7e875
    retrieval_temporal_encoder:
      enabled: true
      mode: online
      repository: ${oc.env:ROBODEMO_VJEPA2_SOURCE}
      checkpoint: ${oc.env:ROBODEMO_VJEPA2_WEIGHTS}
      backend: vjepa2
      output_dim: 1408
      trainable: false
      force_eval: true
      output: pre_pool_spatiotemporal_tokens
    retrieval_motion_scale: 0.01
    execution_training:
      mode: tbptt
      alignment: endpoint
    memory_prefix:
      age_values:
      - 0
      - 1
      - 3
      - 7
      - 15
      - 31
      - 63
      reject_short_prefix: true
      synchronize_across_ranks: true
      schedule_offset: 0
    retrieval_positive:
      require_different_episode: true
    optimizer_groups:
      pretrained_backbone_lr_multiplier: 0.1
      ttt_slow_lr_multiplier: 1.0
      resampler_lr_multiplier: 5.0
      register_query_lr_multiplier: 5.0
      metadata_film_lr_multiplier: 5.0
      merge_gate_lr_multiplier: 1.0
  action_model:
    action_dim: 60
    state_dim: 60
    max_action_dim: 60
    action_chunk_size: 30
    future_action_window_size: 29
    past_action_window_size: 0
datasets:
  vla_data:
    dataset_py: demottt_imitationgame
    data_mix: ig_10k_fullshot_150k
    selected_tasks: []
    robot_type_override: dual_panda_joint
    segment_length: 8
    trajectory_stride: 1
    retrieval_context_frames: 4
    context_fps: 30.0
    augment: false
    include_state: true
    action_horizon: 30
trainer:
  is_resume: false
