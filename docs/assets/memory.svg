<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="458" viewBox="0 0 1120 458" role="img" aria-labelledby="title desc">
  <title id="title">Two independent memories, read in sequence</title>
  <desc id="desc">Reference video initializes intent memory once. Completed interactions update a separate progress memory. Within each Action-DiT block, action tokens read Retrieval-TTT first and Execution-TTT second. Memory writes occur outside action denoising.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="m0 0 6 3-6 3" fill="none" stroke="#526358" stroke-width="1.2"/></marker>
  </defs>
  <rect width="1120" height="458" rx="4" fill="#f8f7f1"/>
  <g font-family="'Avenir Next', 'Trebuchet MS', sans-serif">
    <text x="40" y="42" font-size="14" fill="#697367" letter-spacing="2.5">SEPARATE CONTEXT WRITES</text>
    <text x="40" y="100" font-size="17" fill="#255d52">Reference video</text>
    <g fill="#e0eadc" stroke="#8da389">
      <rect x="40" y="119" width="45" height="32" rx="3"/>
      <rect x="92" y="119" width="45" height="32" rx="3"/>
      <rect x="144" y="119" width="45" height="32" rx="3"/>
    </g>
    <path d="M204 136H235" fill="none" stroke="#526358" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="249" y="88" width="245" height="102" rx="5" fill="#e0eadc" stroke="#a8bca3"/>
    <text x="273" y="127" font-size="23" font-weight="600" fill="#255d52">Intent memory</text>
    <text x="273" y="159" font-size="16" fill="#4b6b50">Initialize once, then hold fixed</text>
    <rect x="578" y="88" width="245" height="102" rx="5" fill="#f1e0d1" stroke="#d5b197"/>
    <text x="602" y="127" font-size="23" font-weight="600" fill="#a94f37">Progress memory</text>
    <text x="602" y="159" font-size="16" fill="#8f654e">Update after each transition</text>
    <path d="M899 136H838" fill="none" stroke="#526358" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="918" y="116" font-size="17" fill="#a94f37">Completed interactions</text>
    <text x="918" y="145" font-size="15" fill="#7b7468">Observation, robot state,</text>
    <text x="918" y="169" font-size="15" fill="#7b7468">and applied action</text>
    <path d="M371 197V293" fill="none" stroke="#9aaa97" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
    <path d="M700 197V293" fill="none" stroke="#9aaa97" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
    <text x="40" y="266" font-size="14" fill="#697367" letter-spacing="2.5">CASCADED MEMORY READS</text>
    <rect x="40" y="308" width="154" height="76" rx="5" fill="#eeeee6" stroke="#ccd0c3"/>
    <text x="117" y="353" text-anchor="middle" font-size="20" fill="#425547">Action tokens</text>
    <path d="M202 346H235" fill="none" stroke="#526358" stroke-width="1.7" marker-end="url(#arrow)"/>
    <rect x="249" y="304" width="245" height="84" rx="5" fill="#255d52"/>
    <text x="271" y="337" font-size="13" letter-spacing="1.5" fill="#c2d6bf">01 / REFERENCE GUIDANCE</text>
    <text x="271" y="371" font-size="25" font-weight="600" fill="#fffef6">Retrieval-TTT</text>
    <path d="M506 346H564" fill="none" stroke="#526358" stroke-width="1.7" marker-end="url(#arrow)"/>
    <rect x="578" y="304" width="245" height="84" rx="5" fill="#ad543b"/>
    <text x="600" y="337" font-size="13" letter-spacing="1.5" fill="#f7d9c2">02 / PROGRESS REFINEMENT</text>
    <text x="600" y="371" font-size="25" font-weight="600" fill="#fffef6">Execution-TTT</text>
    <path d="M836 346H898" fill="none" stroke="#526358" stroke-width="1.7" marker-end="url(#arrow)"/>
    <rect x="914" y="308" width="166" height="76" rx="5" fill="#eeeee6" stroke="#ccd0c3"/>
    <text x="997" y="340" text-anchor="middle" font-size="19" fill="#425547">Conditioned</text>
    <text x="997" y="365" text-anchor="middle" font-size="19" fill="#425547">action tokens</text>
    <text x="40" y="432" font-size="16" fill="#697367">Inside each Action-DiT block. Both memories are read-only during action denoising.</text>
  </g>
</svg>
