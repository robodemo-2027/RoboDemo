    <text x="778" y="402">5</text>
  </g>
  <g font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="12" letter-spacing="1.1" fill="#5c685f">
    <text x="166" y="398">FULL50 SUCCESS RATE</text>
    <text x="508" y="398">BENCHMARK TASKS</text>
    <text x="824" y="398">RELEASED CHECKPOINTS</text>
