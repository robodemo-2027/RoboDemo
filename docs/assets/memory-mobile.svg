<svg xmlns="http://www.w3.org/2000/svg" width="600" height="845" viewBox="0 0 600 845" role="img" aria-labelledby="title desc">
  <title id="title">Two independent memories, read in sequence</title>
  <desc id="desc">Reference video initializes intent memory once. Completed interactions update progress memory. Action tokens read Retrieval-TTT first and Execution-TTT second inside each Action-DiT block.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="m0 0 6 3-6 3" fill="none" stroke="#657564" stroke-width="1.2"/></marker>
  </defs>
  <rect width="600" height="845" rx="4" fill="#f8f7f1"/>
  <g font-family="'Avenir Next', 'Trebuchet MS', sans-serif">
    <text x="32" y="44" font-size="20" fill="#697367" letter-spacing="2">SEPARATE CONTEXT WRITES</text>
    <rect x="32" y="72" width="255" height="180" rx="5" fill="#e0eadc" stroke="#a8bca3"/>
    <text x="53" y="111" font-size="23" fill="#4b6b50">Reference video</text>
    <path d="M53 133H266" stroke="#b2c3a8"/>
    <text x="53" y="176" font-size="28" font-weight="600" fill="#255d52">Intent memory</text>
    <text x="53" y="213" font-size="22" fill="#4b6b50">Initialize once</text>
    <rect x="311" y="72" width="257" height="180" rx="5" fill="#f1e0d1" stroke="#d5b197"/>
    <text x="332" y="111" font-size="23" fill="#8f654e">Interactions</text>
    <path d="M332 133H547" stroke="#d5b197"/>
    <text x="332" y="176" font-size="27" font-weight="600" fill="#a94f37">Progress memory</text>
    <text x="332" y="213" font-size="22" fill="#8f654e">Update each step</text>
    <path d="M159 260V280H60V442H111" fill="none" stroke="#9aaa97" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <path d="M440 260V280H541V588H489" fill="none" stroke="#9aaa97" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <text x="300" y="336" text-anchor="middle" font-size="27" fill="#425547">Action tokens</text>
    <path d="M300 354V389" fill="none" stroke="#657564" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="124" y="398" width="352" height="94" rx="5" fill="#255d52"/>
    <text x="148" y="431" font-size="17" letter-spacing="1.3" fill="#c2d6bf">01 / REFERENCE GUIDANCE</text>
    <text x="148" y="469" font-size="31" font-weight="600" fill="#fffef6">Retrieval-TTT</text>
    <path d="M300 502V536" fill="none" stroke="#657564" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="124" y="546" width="352" height="94" rx="5" fill="#ad543b"/>
    <text x="148" y="579" font-size="17" letter-spacing="1.3" fill="#f7d9c2">02 / PROGRESS REFINEMENT</text>
    <text x="148" y="617" font-size="31" font-weight="600" fill="#fffef6">Execution-TTT</text>
    <path d="M300 650V682" fill="none" stroke="#657564" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="124" y="692" width="352" height="72" rx="5" fill="#eeeee6" stroke="#ccd0c3"/>
    <text x="300" y="736" text-anchor="middle" font-size="25" fill="#425547">Conditioned action tokens</text>
    <text x="300" y="812" text-anchor="middle" font-size="21" fill="#697367">Inside each Action-DiT block.</text>
  </g>
</svg>
