<svg xmlns="http://www.w3.org/2000/svg" width="600" height="565" viewBox="0 0 600 565" role="img" aria-labelledby="title desc">
  <title id="title">RoboDemo</title>
  <desc id="desc">Keep the intent. Track the interaction. Full50 success rate: 84.6 percent across 50 tasks. Five released checkpoints.</desc>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#c1cabe"/></pattern>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f8f7f1"/><stop offset="1" stop-color="#eeefe6"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="m0 0 6 3-6 3" fill="none" stroke="#255d52" stroke-width="1.3"/></marker>
  </defs>
  <rect width="600" height="565" fill="url(#paper)"/>
  <text x="38" y="40" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="16" letter-spacing="2.2" fill="#255d52">ROBOT LEARNING / DUAL-CASCADED TTT</text>
  <g font-family="Baskerville, Georgia, serif" fill="#203b33">
    <text x="33" y="136" font-size="94" letter-spacing="-3.5">RoboDemo</text>
    <text x="38" y="199" font-size="35">Keep the <tspan font-style="italic" fill="#255d52">intent.</tspan></text>
    <text x="38" y="243" font-size="35">Track the <tspan font-style="italic" fill="#b84f36">interaction.</tspan></text>
  </g>
  <rect x="38" y="274" width="524" height="169" fill="url(#dots)" opacity=".7"/>
  <path d="M79 402C119 272 459 262 526 376" fill="none" stroke="#cbd5c7"/>
  <circle cx="165" cy="342" r="48" fill="#e0eadc" stroke="#255d52" stroke-width="1.5"/>
  <circle cx="435" cy="342" r="48" fill="#f1dbca" stroke="#b84f36" stroke-width="1.5"/>
  <path d="M225 342H375" fill="none" stroke="#255d52" stroke-width="2" marker-end="url(#arrow)"/>
  <g font-family="Baskerville, Georgia, serif" font-size="48" text-anchor="middle">
    <text x="165" y="358" fill="#255d52">R</text>
    <text x="435" y="358" fill="#b84f36">E</text>
  </g>
  <g font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="20" letter-spacing="2" text-anchor="middle">
    <text x="165" y="427" fill="#255d52">INTENT</text>
    <text x="435" y="427" fill="#9f5039">PROGRESS</text>
  </g>
  <path d="M38 454H562" stroke="#cbd2c6"/>
  <g font-family="Baskerville, Georgia, serif" font-size="42" fill="#203b33">
    <text x="38" y="508">84.6<tspan font-size="29">%</tspan></text>
    <text x="245" y="508">50</text>
    <text x="423" y="508">5</text>
  </g>
  <g font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="19" fill="#5c685f">
    <text x="38" y="540">Full50 SR</text>
    <text x="245" y="540">Tasks</text>
    <text x="423" y="540">Checkpoints</text>
  </g>
</svg>
